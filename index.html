<style>
:root{--bg:#f6f5f2;--fg:#1c1b1a;--mu:#77736d;--tr:#e4e1db;--bt:#1c1b1a;--bf:#f6f5f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171616;--fg:#f1efeb;--mu:#9a958d;--tr:#2b2928;--bt:#f1efeb;--bf:#171616}}
:root[data-theme="dark"]{--bg:#171616;--fg:#f1efeb;--mu:#9a958d;--tr:#2b2928;--bt:#f1efeb;--bf:#171616}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Cairo,Tahoma,"Segoe UI",sans-serif}
#app{max-width:440px;height:100%;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;overflow-y:auto}
header{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.col{display:flex;flex-direction:column;gap:12px;text-align:center}
#play{flex:1;min-height:0}
#bd{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.hud{display:flex;justify-content:space-between;font-weight:800}
.mu{color:var(--mu);margin:0;line-height:1.8}
h1{font-size:1.8rem;margin:0}h2{margin:0}p{margin:0;line-height:1.8}
.bar{height:8px;border-radius:4px;background:var(--tr);overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--fg)}
.g{display:grid;animation:pop .18s}@keyframes pop{from{transform:scale(.93);opacity:.4}}.shake{animation:shk .25s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--bt);color:var(--bf);padding:8px 16px;border-radius:20px;z-index:20;font-weight:800}
.g button{border:0;border-radius:var(--rad,6px);padding:0;cursor:pointer;min-width:0;min-height:0;font:inherit;line-height:1;color:var(--fg);background:var(--tr);overflow:hidden;touch-action:manipulation}
.btn{font:inherit;font-weight:800;border:0;border-radius:10px;padding:12px 24px;background:var(--bt);color:var(--bf);cursor:pointer}
.btn.alt{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--tr)}
.chip{font:inherit;border:0;border-radius:20px;padding:8px 16px;background:var(--tr);color:var(--fg);cursor:pointer}
.chip.on{background:var(--bt);color:var(--bf)}
.ic{font:inherit;border:0;background:transparent;color:var(--fg);font-size:1.2rem;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hide{display:none!important}#logo{width:120px;height:120px;border-radius:24px;margin:0 auto;display:block}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:rgba(0,0,0,.6)}
.ov.blk{background:#000;color:#fff}
.card{background:#fff;color:#000;border-radius:14px;padding:20px;width:min(88%,360px);text-align:center;display:flex;flex-direction:column;gap:12px}
.card .btn{background:#000;color:#fff}.card .alt{background:transparent;color:#000;box-shadow:inset 0 0 0 2px #ccc}
.card .bar{background:#ddd}.card .bar i{background:#000}
#mp{position:fixed;inset:0;background:var(--bg);display:grid;z-index:8;padding:env(safe-area-inset-top,0px) 8px calc(68px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.pb{padding:8px;display:flex;flex-direction:column;gap:4px;min-height:0;min-width:0;overflow:hidden;border:1px solid var(--tr);box-sizing:border-box}
.pb.r{transform:rotate(180deg)}.pb small{text-align:center;color:var(--mu)}
#mc{position:fixed;left:50%;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:flex;flex-direction:row;gap:8px}
</style>
</head>
